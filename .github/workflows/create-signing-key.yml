name: Create signing key (one-time, optional)

# Optional. Run this ONCE if you want new builds to install over old ones and keep your progress.
# It creates a private signing key and gives you the four values to save as repository secrets.
# See the README, "Keep your progress between updates".
#
# IMPORTANT: use a PRIVATE repository for this. The result is an artifact that anyone who can see
# the repo could download. Delete the artifact after you have saved the secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate keystore and secrets file
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore ci.jks -alias crochet -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Crochet Quest, O=Personal, C=US"
          {
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=crochet"
            echo "SIGNING_KEY_PASSWORD=$PASS"
            echo "SIGNING_KEYSTORE_BASE64=$(base64 -w0 ci.jks)"
          } > signing-secrets.txt

      - name: Upload secrets file (keep it private, delete after use)
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: signing-secrets.txt
          retention-days: 1
          if-no-files-found: error
